</style></head><body>
<section id="access-gate" class="gate" aria-live="polite"><h1 id="access-title">회원 확인 중이에요</h1><p id="access-message">잠시만 기다려 주세요.</p><a id="access-link" href="../../account.html" hidden>로그인하기</a><a href="../../index.html">홈으로</a></section>
<main id="story-content" hidden><header class="toolbar"><a href="../../index.html" aria-label="온마음 홈으로">← 온마음</a><span class="book-name">왕산악과 거문고</span></header>
<article id="book-page" class="book-page" aria-label="동화 표지"><img id="scene-image" alt="" fetchpriority="high"><div class="veil" aria-hidden="true"></div><section id="cover-text" class="cover-text"><p class="eyebrow">한국의 악기 유래 전설 · 고구려</p><h1 id="cover-title">왕산악과 거문고</h1><h2>왕산악이 연주하자 검은 학이 춤을 추었다고 해요. 어떤 음악이었을까요?</h2><p class="cover-hint">밑줄 친 표현을 누르면 설명을 볼 수 있어요.</p><button id="start-reading" type="button">이야기 읽기 →</button></section><section id="page-text" class="page-text" hidden><div id="ko-block" lang="ko"><p class="language-label">한국어</p><div id="ko-text"></div></div></section><span id="page-mark" class="page-mark" aria-hidden="true"></span></article>
<footer class="navigation"><button id="previous" type="button">← 이전</button><span id="page-status" role="status" aria-live="polite">표지</span><button id="next" type="button">다음 →</button><button id="return-cover" type="button" hidden>처음으로 ↺</button></footer></main>
<dialog id="annotation-dialog" aria-labelledby="annotation-title"><button id="close-annotation" class="close" type="button" aria-label="주석 닫기">×</button><p id="annotation-type" class="language-label"></p><h2 id="annotation-title"></h2><p id="annotation-explanation"></p><p id="annotation-example" class="example"></p></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script type="module">
import {storyPages,storyCover,getStoryPage,getAnnotation} from './왕산악과 거문고-본문.mjs';
const $=s=>document.querySelector(s);
const hasPartner=false;
function normalizePage(value){if(!/^\d+$/.test(String(value??'')))return 0;const n=Number(value);return Number.isInteger(n)&&n>=0&&n<=20?n:0;}
function isLocalPreview(host,search){return ['localhost','127.0.0.1'].includes(host)&&new URLSearchParams(search).get('preview')==='1';}
function canReadProfile(profile){return profile?.membership_type==='teacher'&&profile?.verification_status==='verified';}
let currentPage=normalizePage(new URL(location.href).searchParams.get('page'));
let mode=hasPartner?'both':'ko',authorized=false,annotationTrigger=null;
const dialog=$('#annotation-dialog');
function closeAnnotation(restore=true){if(dialog.open)dialog.close();if(restore&&annotationTrigger?.isConnected)annotationTrigger.focus();annotationTrigger=null;}
function openAnnotation(annotation,trigger){if(!annotation)return;annotationTrigger=trigger;$('#annotation-title').textContent=annotation.lemma;$('#annotation-type').textContent=annotation.type;$('#annotation-explanation').textContent=annotation.explanation;$('#annotation-example').textContent=annotation.note;if(hasPartner)$('#annotation-translation').textContent=annotation.translation;dialog.showModal();$('#close-annotation').focus();}
function makeTrigger(text,id,page){const b=document.createElement('button');b.type='button';b.className='annotation';b.textContent=text;b.dataset.annotationId=id;b.setAttribute('aria-haspopup','dialog');b.setAttribute('aria-label',text+' — 설명 보기');b.addEventListener('click',()=>openAnnotation(getAnnotation(page,id),b));return b;}
function appendKorean(page){const block=$('#ko-text');block.replaceChildren();let line=document.createElement('p');block.append(line);for(const segment of page.koreanSegments){if(segment.annotationId){line.append(makeTrigger(segment.text,segment.annotationId,page.pageNumber));continue;}const parts=segment.text.split(/(?<=[.!?])\s+/u);for(let i=0;i<parts.length;i++){if(i){line=document.createElement('p');block.append(line);}if(parts[i])line.append(document.createTextNode(parts[i]));}}}
function applyMode(){document.body.dataset.mode=mode;$('#ko-block').hidden=mode==='vi';if(hasPartner)$('#partner-block').hidden=mode==='ko';for(const b of document.querySelectorAll('button[data-mode]'))b.setAttribute('aria-pressed',String(b.dataset.mode===mode));}
function render(){if(!authorized)return;closeAnnotation(false);const page=getStoryPage(currentPage);document.body.dataset.page=String(currentPage);$('#cover-text').hidden=!!page;$('#page-text').hidden=!page;if(hasPartner)$('#language-control').hidden=!page;$('#previous').disabled=currentPage===0;$('#next').hidden=currentPage===20;$('#return-cover').hidden=currentPage!==20;$('#page-status').textContent=page?currentPage+' / 20':'표지';$('#page-mark').textContent=page?String(currentPage).padStart(2,'0'):'';$('#book-page').setAttribute('aria-label',page?storyCover.titleKorean+' '+currentPage+'쪽':storyCover.titleKorean+' 표지');const img=$('#scene-image');img.src=page?.image??storyCover.image;img.alt=page?.imageAlt??storyCover.imageAlt;document.title=storyCover.titleKorean+(page?' · '+currentPage+'쪽':'')+' | 온마음';if(page){appendKorean(page);if(hasPartner){const block=$('#partner-text');block.replaceChildren();for(const text of page.vietnameseText.split(/(?<=[.!?])\s+/u)){const p=document.createElement('p');p.textContent=text;block.append(p);}}}applyMode();const next=getStoryPage(currentPage+1);if(next){const preload=new Image();preload.src=next.image;}}
function navigate(n){if(!authorized||n<0||n>20||n===currentPage)return;currentPage=n;const url=new URL(location.href);if(n===0)url.searchParams.delete('page');else url.searchParams.set('page',String(n));history.pushState({page:n},'',url);render();}
$('#start-reading').addEventListener('click',()=>{navigate(1);$('#next').focus();});$('#previous').addEventListener('click',()=>navigate(currentPage-1));$('#next').addEventListener('click',()=>navigate(currentPage+1));$('#return-cover').addEventListener('click',()=>{navigate(0);$('#start-reading').focus();});for(const b of document.querySelectorAll('button[data-mode]'))b.addEventListener('click',()=>{mode=b.dataset.mode;applyMode();});$('#close-annotation').addEventListener('click',()=>closeAnnotation());dialog.addEventListener('cancel',event=>{event.preventDefault();closeAnnotation();});dialog.addEventListener('click',event=>{const r=dialog.getBoundingClientRect();if(event.target===dialog&&(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom))closeAnnotation();});window.addEventListener('popstate',()=>{currentPage=normalizePage(new URL(location.href).searchParams.get('page'));render();});document.addEventListener('keydown',event=>{if(!authorized||dialog.open||event.altKey||event.ctrlKey||event.metaKey||event.target.closest('input,textarea,select,[contenteditable]'))return;if(event.key==='ArrowRight'){event.preventDefault();navigate(currentPage+1);}if(event.key==='ArrowLeft'){event.preventDefault();navigate(currentPage-1);}});
if(!hasPartner){const title=$('#cover-title');title.replaceChildren(document.createTextNode('왕산악과 '),makeTrigger('거문고','거문고','cover'));}
function gate(title,message,login=false){authorized=false;$('#story-content').hidden=true;$('#access-gate').hidden=false;$('#access-title').textContent=title;$('#access-message').textContent=message;$('#access-link').hidden=!login;closeAnnotation(false);}
function reveal(){authorized=true;$('#access-gate').hidden=true;$('#story-content').hidden=false;render();}
async function verifyAccess(){if(isLocalPreview(location.hostname,location.search)){reveal();return;}if(!window.supabase){gate('로그인 확인을 불러오지 못했어요','인터넷 연결을 확인한 뒤 페이지를 새로고침해 주세요.');return;}try{const client=window.supabase.createClient('https://xrrgfbidtzsohddiwcbn.supabase.co','sb_publishable_W7QqGrgNUQ77KgRtdSaANA_F4zrqp8P');const {data,error}=await client.auth.getSession();const user=data?.session?.user;if(error||!user){gate('회원 전용 동화입니다','온마음 한국어에 로그인한 인증 회원만 이용할 수 있어요.',true);return;}const {data:profile,error:profileError}=await client.from('profiles').select('membership_type, verification_status').eq('id',user.id).single();if(profileError||!canReadProfile(profile)){gate('인증 완료 후 이용할 수 있어요','회원 인증 상태를 확인해 주세요. 인증이 완료된 뒤 다시 열면 동화가 표시됩니다.');return;}reveal();client.auth.onAuthStateChange((event,session)=>{if(!session)gate('회원 전용 동화입니다','다시 로그인해 주세요.',true);});}catch{gate('로그인 확인을 불러오지 못했어요','인터넷 연결을 확인한 뒤 페이지를 새로고침해 주세요.');}}
verifyAccess();

</script></body></html>
