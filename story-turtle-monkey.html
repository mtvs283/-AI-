<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="한국어와 타갈로그어로 읽고, 단어와 문법을 눌러 배우는 거북이와 원숭이 이야기"
  />
  <title>거북이와 원숭이 | 온마음 한국어</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Noto+Serif+KR:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --paper: #f2efe6;
      --sage: #c7d8c8;
      --sage-deep: #708f79;
      --ink: #253129;
      --muted: #5e6b61;
      --gold: #a17e47;
      --card: rgba(251, 249, 243, 0.97);
      --shadow: 0 24px 70px rgba(34, 48, 38, 0.18);
    }

    * { box-sizing: border-box; }

    [hidden] { display: none !important; }

    html, body {
      margin: 0;
      min-height: 100%;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 8%, rgba(255, 255, 255, 0.8), transparent 28%),
        var(--paper);
    }

    body {
      font-family: 'Noto Serif KR', serif;
    }

    button, a { font: inherit; }

    .site-header {
      width: min(1440px, calc(100% - 40px));
      height: 72px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .back-link {
      color: var(--ink);
      text-decoration: none;
      font-size: 14px;
      letter-spacing: 0.02em;
    }

    .back-link:hover { color: var(--sage-deep); }

    .story-title {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.14em;
    }

    .sample-badge {
      padding: 6px 10px;
      border: 1px solid rgba(37, 49, 41, 0.16);
      border-radius: 999px;
      color: var(--muted);
      font-size: 11px;
    }

    main {
      width: min(1440px, calc(100% - 40px));
      margin: 0 auto 32px;
    }

    .access-gate {
      min-height: calc(100vh - 122px);
      display: grid;
      place-items: center;
      padding: 40px 20px;
    }

    .access-card {
      width: min(520px, 100%);
      padding: clamp(32px, 6vw, 58px);
      border: 1px solid rgba(50, 65, 54, 0.14);
      border-radius: 18px;
      background: rgba(251, 249, 243, 0.92);
      box-shadow: var(--shadow);
      text-align: center;
    }

    .access-eyebrow {
      margin: 0 0 12px;
      color: var(--sage-deep);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.16em;
    }

    .access-card h2 {
      margin: 0;
      font-size: clamp(24px, 4vw, 34px);
    }

    .access-message {
      margin: 18px auto 26px;
      color: var(--muted);
      line-height: 1.75;
      word-break: keep-all;
    }

    .access-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 10px 20px;
      border-radius: 999px;
      color: #fff;
      background: var(--sage-deep);
      text-decoration: none;
    }

    .book-page {
      display: grid;
      grid-template-columns: minmax(340px, 43%) minmax(0, 57%);
      min-height: calc(100vh - 122px);
      overflow: hidden;
      border: 1px solid rgba(50, 65, 54, 0.14);
      border-radius: 3px;
      background: var(--sage);
      box-shadow: var(--shadow);
    }

    .illustration-wrap {
      position: relative;
      min-height: 620px;
      overflow: hidden;
      background: #708276;
    }

    .illustration {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .text-panel {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(48px, 6vw, 96px);
      background:
        linear-gradient(rgba(199, 216, 200, 0.95), rgba(199, 216, 200, 0.95)),
        repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(255,255,255,.12) 4px);
    }

    .page-number {
      position: absolute;
      top: 28px;
      right: 34px;
      color: rgba(37, 49, 41, 0.55);
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px;
    }

    .language-label {
      margin: 0 0 14px;
      color: var(--sage-deep);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .korean-text {
      max-width: 700px;
      margin: 0;
      font-size: clamp(19px, 1.6vw, 25px);
      line-height: 1.78;
      word-break: keep-all;
    }

    .annotation-trigger {
      position: relative;
      display: inline;
      margin: 0;
      padding: 0 1px 2px;
      border: 0;
      border-bottom: 1px dashed var(--gold);
      color: inherit;
      background: transparent;
      cursor: help;
      text-align: inherit;
      transition: color 160ms ease, background-color 160ms ease;
    }

    .annotation-trigger:hover,
    .annotation-trigger:focus-visible,
    .annotation-trigger[aria-expanded="true"] {
      outline: none;
      color: #5e4726;
      background: rgba(255, 248, 219, 0.5);
    }

    .divider {
      display: flex;
      align-items: center;
      width: min(290px, 64%);
      margin: clamp(34px, 5vh, 54px) 0;
      color: rgba(74, 93, 79, 0.56);
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: currentColor;
    }

    .divider-mark {
      width: 9px;
      height: 9px;
      margin: 0 10px;
      border: 1px solid currentColor;
      transform: rotate(45deg);
    }

    .tagalog-text {
      max-width: 720px;
      margin: 0;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(21px, 1.75vw, 28px);
      line-height: 1.5;
      letter-spacing: 0.005em;
    }

    .hint {
      margin: 26px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .story-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 18px 0 0;
    }

    .nav-button {
      min-width: 88px;
      padding: 9px 14px;
      border: 1px solid rgba(37, 49, 41, 0.2);
      border-radius: 999px;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.45);
    }

    .nav-button:disabled {
      opacity: 0.38;
      cursor: not-allowed;
    }

    .page-status {
      min-width: 72px;
      color: var(--muted);
      font-family: 'Cormorant Garamond', serif;
      font-size: 17px;
      text-align: center;
    }

    .annotation-popover {
      position: fixed;
      z-index: 100;
      width: min(360px, calc(100vw - 32px));
      padding: 24px;
      border: 1px solid rgba(68, 82, 71, 0.18);
      border-radius: 14px;
      background: var(--card);
      box-shadow: 0 18px 50px rgba(24, 36, 27, 0.24);
    }

    .popover-close {
      position: absolute;
      top: 13px;
      right: 14px;
      width: 30px;
      height: 30px;
      padding: 0;
      border: 0;
      color: var(--muted);
      background: transparent;
      font-size: 22px;
      cursor: pointer;
    }

    .annotation-type {
      margin: 0 34px 5px 0;
      color: var(--sage-deep);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .annotation-title {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
    }

    .annotation-translation {
      margin: 5px 0 16px;
      color: #755a32;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 19px;
      font-weight: 600;
    }

    .annotation-explanation,
    .annotation-note {
      margin: 0;
      font-size: 14px;
      line-height: 1.65;
    }

    .annotation-note {
      margin-top: 11px;
      padding-top: 11px;
      border-top: 1px solid rgba(37, 49, 41, 0.12);
      color: var(--muted);
    }

    @media (max-width: 820px) {
      .site-header,
      main {
        width: min(100% - 24px, 680px);
      }

      .site-header { height: 62px; }
      .story-title { font-size: 13px; }

      .book-page {
        grid-template-columns: 1fr;
        min-height: 0;
      }

      .illustration-wrap {
        min-height: 0;
        aspect-ratio: 3 / 4;
      }

      .text-panel {
        min-height: 620px;
        padding: 54px 28px 48px;
        justify-content: flex-start;
      }

      .page-number {
        top: 20px;
        right: 24px;
      }

      .korean-text {
        font-size: 19px;
        line-height: 1.75;
      }

      .tagalog-text {
        font-size: 22px;
        line-height: 1.48;
      }

      .annotation-popover {
        left: 12px !important;
        right: 12px;
        bottom: 12px;
        top: auto !important;
        width: auto;
        max-height: calc(100dvh - 24px);
        overflow-y: auto;
        border-radius: 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="back-link" href="./index.html" aria-label="온마음 한국어 홈으로 돌아가기">← 홈</a>
    <h1 class="story-title">거북이와 원숭이</h1>
    <span class="sample-badge">회원 전용</span>
  </header>

  <main>
    <section class="access-gate" id="access-gate" aria-live="polite">
      <div class="access-card">
        <p class="access-eyebrow">ONMAEUM INTERACTIVE STORY</p>
        <h2 id="access-title">회원 정보를 확인하고 있어요</h2>
        <p class="access-message" id="access-message">잠시만 기다려 주세요.</p>
        <a class="access-link" id="access-link" href="./account.html" hidden>로그인하기</a>
      </div>
    </section>

    <div id="story-content" hidden>
      <article class="book-page" id="book-page" aria-label="거북이와 원숭이 1쪽">
        <div class="illustration-wrap">
          <img class="illustration" id="story-image" alt="" decoding="async" />
        </div>

        <section class="text-panel">
          <span class="page-number" id="page-number" aria-label="1쪽">01</span>

          <p class="language-label">한국어 · Korean</p>
          <p class="korean-text" id="korean-text"></p>

          <div class="divider" aria-hidden="true">
            <span class="divider-mark"></span>
          </div>

          <p class="language-label">Tagalog</p>
          <p class="tagalog-text" id="tagalog-text" lang="tl"></p>
          <p class="hint">점선이 있는 한국어 표현을 눌러 뜻과 문법을 확인해 보세요.</p>
        </section>
      </article>

      <nav class="story-nav" aria-label="동화 페이지 이동">
        <button class="nav-button" id="previous-page" type="button">이전</button>
        <span class="page-status" id="page-status" aria-live="polite">1 / 20</span>
        <button class="nav-button" id="next-page" type="button">다음</button>
      </nav>
    </div>
  </main>

  <aside
    class="annotation-popover"
    id="annotation-popover"
    role="dialog"
    aria-live="polite"
    aria-modal="false"
    aria-labelledby="annotation-title"
    hidden
  >
    <button class="popover-close" id="popover-close" type="button" aria-label="주석 닫기">×</button>
    <p class="annotation-type" id="annotation-type"></p>
    <h2 class="annotation-title" id="annotation-title"></h2>
    <p class="annotation-translation" id="annotation-translation" lang="tl"></p>
    <p class="annotation-explanation" id="annotation-explanation"></p>
    <p class="annotation-note" id="annotation-note"></p>
  </aside>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module">
    import { getAnnotation, getStoryPage, storyPages } from './story-turtle-monkey-data.mjs';

    const SUPABASE_URL = 'https://xrrgfbidtzsohddiwcbn.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_W7QqGrgNUQ77KgRtdSaANA_F4zrqp8P';
    const supabaseClient = window.supabase
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
      : null;

    const accessGate = document.querySelector('#access-gate');
    const accessTitle = document.querySelector('#access-title');
    const accessMessage = document.querySelector('#access-message');
    const accessLink = document.querySelector('#access-link');
    const storyContent = document.querySelector('#story-content');
    const bookPage = document.querySelector('#book-page');
    const image = document.querySelector('#story-image');
    const koreanText = document.querySelector('#korean-text');
    const tagalogText = document.querySelector('#tagalog-text');
    const pageNumber = document.querySelector('#page-number');
    const pageStatus = document.querySelector('#page-status');
    const previousButton = document.querySelector('#previous-page');
    const nextButton = document.querySelector('#next-page');
    const popover = document.querySelector('#annotation-popover');
    const closeButton = document.querySelector('#popover-close');
    const requestedPage = Number.parseInt(new URLSearchParams(location.search).get('page'), 10);
    let currentPageNumber =
      Number.isInteger(requestedPage) && requestedPage >= 1 && requestedPage <= storyPages.length
        ? requestedPage
        : 1;
    let activeTrigger = null;
    let nextImagePreload = null;

    function showAccessGate(title, message, showLogin = false) {
      accessTitle.textContent = title;
      accessMessage.textContent = message;
      accessLink.hidden = !showLogin;
      storyContent.hidden = true;
      accessGate.hidden = false;
    }

    function revealStory() {
      accessGate.hidden = true;
      storyContent.hidden = false;
      renderPage(currentPageNumber);
    }

    async function verifyAccess() {
      const isLocalPreview =
        ['localhost', '127.0.0.1'].includes(location.hostname) &&
        new URLSearchParams(location.search).get('preview') === '1';
      if (isLocalPreview) {
        revealStory();
        return;
      }

      if (!supabaseClient) {
        showAccessGate(
          '로그인 확인을 불러오지 못했어요',
          '인터넷 연결을 확인한 뒤 페이지를 새로고침해 주세요.'
        );
        return;
      }

      const { data: sessionData, error: sessionError } = await supabaseClient.auth.getSession();
      const user = sessionData?.session?.user;
      if (sessionError || !user) {
        showAccessGate(
          '회원 전용 동화입니다',
          '온마음 한국어에 로그인한 인증 회원만 이용할 수 있어요.',
          true
        );
        return;
      }

      const { data: profile, error: profileError } = await supabaseClient
        .from('profiles')
        .select('membership_type, verification_status')
        .eq('id', user.id)
        .single();

      if (
        profileError ||
        profile?.membership_type !== 'teacher' ||
        profile?.verification_status !== 'verified'
      ) {
        showAccessGate(
          '인증 완료 후 이용할 수 있어요',
          '회원 인증 상태를 확인해 주세요. 인증이 완료된 뒤 다시 열면 동화가 표시됩니다.'
        );
        return;
      }

      revealStory();
    }

    function renderPage(nextPageNumber) {
      const page = getStoryPage(nextPageNumber);
      if (!page) return;

      closePopover({ restoreFocus: false });
      currentPageNumber = nextPageNumber;
      image.src = page.image;
      image.alt = page.imageAlt;
      image.loading = nextPageNumber === 1 ? 'eager' : 'lazy';
      tagalogText.textContent = page.tagalogText;
      koreanText.replaceChildren();

      page.koreanSegments.forEach((segment) => {
        if (!segment.annotationId) {
          koreanText.append(document.createTextNode(segment.text));
          return;
        }

        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'annotation-trigger';
        button.textContent = segment.text;
        button.dataset.annotationId = segment.annotationId;
        button.setAttribute('aria-expanded', 'false');
        button.setAttribute('aria-haspopup', 'dialog');
        koreanText.append(button);
      });

      const paddedPage = String(nextPageNumber).padStart(2, '0');
      pageNumber.textContent = paddedPage;
      pageNumber.setAttribute('aria-label', `${nextPageNumber}쪽`);
      pageStatus.textContent = `${nextPageNumber} / ${storyPages.length}`;
      bookPage.setAttribute('aria-label', `거북이와 원숭이 ${nextPageNumber}쪽`);
      previousButton.disabled = nextPageNumber === 1;
      nextButton.disabled = nextPageNumber === storyPages.length;

      const url = new URL(location.href);
      url.searchParams.set('page', String(nextPageNumber));
      history.replaceState({ page: nextPageNumber }, '', url);

      const followingPage = getStoryPage(nextPageNumber + 1);
      if (nextImagePreload) {
        nextImagePreload.src = '';
        nextImagePreload = null;
      }
      if (followingPage) {
        nextImagePreload = new Image();
        nextImagePreload.src = followingPage.image;
      }

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function closePopover({ restoreFocus = true } = {}) {
      if (popover.hidden) return;
      popover.hidden = true;
      if (activeTrigger) {
        activeTrigger.setAttribute('aria-expanded', 'false');
        if (restoreFocus) activeTrigger.focus();
      }
      activeTrigger = null;
    }

    function positionPopover(trigger) {
      if (window.matchMedia('(max-width: 820px)').matches) return;

      const rect = trigger.getBoundingClientRect();
      const width = 360;
      const left = Math.min(
        window.innerWidth - width - 16,
        Math.max(16, rect.left + rect.width / 2 - width / 2)
      );
      const below = rect.bottom + 12;
      const estimatedHeight = 300;
      const top =
        below + estimatedHeight <= window.innerHeight
          ? below
          : Math.max(16, rect.top - estimatedHeight - 12);

      popover.style.left = `${left}px`;
      popover.style.top = `${top}px`;
    }

    function openAnnotation(trigger) {
      const annotation = getAnnotation(currentPageNumber, trigger.dataset.annotationId);
      if (!annotation) return;

      if (activeTrigger && activeTrigger !== trigger) {
        activeTrigger.setAttribute('aria-expanded', 'false');
      }

      activeTrigger = trigger;
      trigger.setAttribute('aria-expanded', 'true');
      document.querySelector('#annotation-type').textContent = annotation.type;
      document.querySelector('#annotation-title').textContent = annotation.lemma;
      document.querySelector('#annotation-translation').textContent = annotation.translation;
      document.querySelector('#annotation-explanation').textContent = annotation.explanation;
      document.querySelector('#annotation-note').textContent = annotation.note;
      popover.hidden = false;
      positionPopover(trigger);
      closeButton.focus();
    }

    koreanText.addEventListener('click', (event) => {
      const trigger = event.target.closest('.annotation-trigger');
      if (!trigger) return;

      if (trigger === activeTrigger && !popover.hidden) {
        closePopover();
        return;
      }

      openAnnotation(trigger);
    });

    previousButton.addEventListener('click', () => {
      if (currentPageNumber > 1) renderPage(currentPageNumber - 1);
    });

    nextButton.addEventListener('click', () => {
      if (currentPageNumber < storyPages.length) renderPage(currentPageNumber + 1);
    });

    closeButton.addEventListener('click', () => closePopover({ restoreFocus: true }));

    document.addEventListener('click', (event) => {
      if (
        popover.hidden ||
        popover.contains(event.target) ||
        event.target.closest('.annotation-trigger')
      ) {
        return;
      }
      closePopover();
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        closePopover({ restoreFocus: true });
        return;
      }
      if (!popover.hidden) return;
      if (event.key === 'ArrowLeft' && currentPageNumber > 1) {
        renderPage(currentPageNumber - 1);
      }
      if (event.key === 'ArrowRight' && currentPageNumber < storyPages.length) {
        renderPage(currentPageNumber + 1);
      }
    });

    window.addEventListener('resize', () => {
      if (activeTrigger && !popover.hidden) positionPopover(activeTrigger);
    });

    verifyAccess();
  </script>
</body>
</html>
