<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="온마음 한국어 교사 인증 승인" />
  <meta name="robots" content="noindex,nofollow" />
  <title>관리자 | 한국어교육AI연구개발원</title>
  <link rel="icon" href="./favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    @font-face {
      font-family: 'ShillaCulture';
      src: url('./Shilla_Culture_B.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: 'Noto Sans KR', system-ui, sans-serif;
      color: #211b15;
      background-color: #efe9dd;
      background-image: linear-gradient(rgba(247,243,235,.82), rgba(243,238,229,.93)), url('./hero-bg.png');
      background-size: 190%;
      background-position: 12% 6%;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }
    button { font: inherit; cursor: pointer; }

    .site-header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 30;
      height: 70px; display: flex; align-items: center; justify-content: space-between;
      gap: 20px; padding: 0 44px;
      background: rgba(246, 242, 235, .9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(86, 67, 47, .16);
    }
    .brand { display: flex; align-items: center; gap: 12px; color: inherit; text-decoration: none; }
    .brand img { width: 46px; height: 46px; object-fit: contain; }
    .brand-title { font-family: 'ShillaCulture', 'Noto Sans KR', sans-serif; font-size: 20px; line-height: 1.05; letter-spacing: -.02em; color: #201912; }
    .brand-sub { margin-top: 3px; color: #6f6558; font-size: 12px; font-weight: 500; }
    .nav-actions { display: flex; align-items: center; gap: 16px; }
    .home-link { color: #7b4c18; text-decoration: none; font-weight: 700; font-size: 14px; white-space: nowrap; }
    .home-link:hover { color: #a3641f; text-decoration: underline; }

    .wrap { width: min(980px, calc(100% - 48px)); margin: 0 auto; padding: 110px 0 70px; }
    h1 {
      margin: 0 0 10px;
      font-family: 'ShillaCulture', 'Noto Sans KR', sans-serif;
      font-size: clamp(30px, 4vw, 42px); color: #2c1d10;
    }
    .lede { margin: 0 0 28px; color: #584d42; font-size: 15px; line-height: 1.75; }

    .gate, .card {
      background: rgba(250, 247, 240, .92);
      border: 1px solid rgba(86, 67, 47, .14);
      padding: 28px 30px;
    }
    .filters { display: flex; gap: 8px; margin-bottom: 16px; }
    .chip {
      padding: 8px 14px; border: 1px solid rgba(52, 43, 34, .22);
      background: rgba(255,255,255,.6); color: #4a4036; font-weight: 700; font-size: 13px;
    }
    .chip.is-active { background: #211407; color: #fff; border-color: #211407; }

    table { width: 100%; border-collapse: collapse; background: rgba(255,255,255,.55); }
    thead th {
      text-align: left; font-size: 13px; color: #6b5f51; font-weight: 700;
      padding: 13px 14px; border-top: 2px solid #211407; border-bottom: 1px solid rgba(86,67,47,.2);
    }
    tbody td { padding: 14px; border-bottom: 1px solid rgba(86,67,47,.12); font-size: 14px; vertical-align: top; }
    tbody tr { cursor: pointer; }
    tbody tr:hover { background: rgba(208,170,114,.14); }
    tbody tr.is-open { background: rgba(208,170,114,.18); }
    .empty { padding: 48px 14px; text-align: center; color: #8a7c69; }
    .col-date { width: 118px; color: #8a7c69; font-size: 13px; white-space: nowrap; }
    .email { color: #6b5f51; font-size: 13px; margin-top: 4px; }

    .badge { display: inline-flex; align-items: center; padding: 3px 10px; font-size: 12px; font-weight: 800; background: #eee4d4; color: #775323; }
    .badge.is-pending { background: #eee4d4; color: #775323; }
    .badge.is-verified { background: #dcecdf; color: #236137; }
    .badge.is-rejected { background: #f4dddd; color: #96352f; }

    .detail {
      display: none;
      padding: 0 14px 18px;
      background: rgba(255,255,255,.45);
      border-bottom: 1px solid rgba(86,67,47,.12);
    }
    .detail.is-open { display: block; }
    .meta { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 24px; margin: 12px 0 18px; color: #574d42; font-size: 14px; line-height: 1.6; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .btn {
      display: inline-block; padding: 11px 20px; border-radius: 3px;
      font-weight: 800; font-size: 14px; border: 1px solid rgba(52,43,34,.18);
    }
    .btn.primary { background: #211407; color: #fff; }
    .btn.ghost { background: rgba(255,255,255,.7); color: #211407; }
    .btn.danger { background: #fff; color: #96352f; border-color: rgba(150, 53, 47, .35); }
    .btn:disabled { opacity: .5; cursor: default; }
    .status { margin: 14px 0 0; font-size: 14px; font-weight: 700; min-height: 1.4em; }
    .status.is-error { color: #a33b2a; }
    .status.is-ok { color: #2e6b46; }

    footer { margin-top: 40px; padding: 18px 44px; background: #211407; color: rgba(255,255,255,.62); font-size: 13px; }
    a { color: #7b4c18; }
    [hidden] { display: none !important; }

    @media (max-width: 820px) {
      .site-header { height: 66px; padding: 0 18px; }
      .brand-sub { display: none; }
      .wrap { width: calc(100% - 32px); padding-top: 96px; }
      .col-date, .col-name { display: none; }
      .meta { grid-template-columns: 1fr; }
      footer { padding: 18px; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./index.html">
      <img src="./logo.png" alt="한국어교육AI연구개발원 로고" />
      <div>
        <div class="brand-title">한국어교육AI연구개발원</div>
        <div class="brand-sub">Korean Edu AI Institute</div>
      </div>
    </a>
    <div class="nav-actions">
      <a class="home-link" href="./account.html">내 계정</a>
      <a class="home-link" href="./board.html">문의 게시판</a>
      <a class="home-link" href="./index.html">홈으로</a>
    </div>
  </header>

  <main class="wrap">
    <h1>교사 인증 승인</h1>
    <p class="lede">제출된 자격 서류를 확인하고 승인하거나 거절합니다. 관리자로 로그인한 계정만 이 화면을 쓸 수 있습니다.</p>

    <div class="gate" id="signed-out-view" hidden>
      <p>관리자 화면은 로그인 후 이용합니다.</p>
      <p><a href="./account.html">로그인하러 가기</a></p>
    </div>

    <div class="gate" id="forbidden-view" hidden>
      <p>이 화면은 관리자만 사용할 수 있습니다.</p>
      <p><a href="./account.html">내 계정으로</a></p>
    </div>

    <div id="admin-view" hidden>
      <div class="filters" role="tablist" aria-label="신청 상태">
        <button class="chip is-active" type="button" data-filter="pending" id="filter-pending">확인 중</button>
        <button class="chip" type="button" data-filter="all" id="filter-all">전체</button>
      </div>
      <p class="status" id="list-status" aria-live="polite"></p>
      <table>
        <thead>
          <tr>
            <th>신청자</th>
            <th class="col-name">서류</th>
            <th>상태</th>
            <th class="col-date">제출일</th>
          </tr>
        </thead>
        <tbody id="list-body">
          <tr><td colspan="4" class="empty">불러오는 중입니다.</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <footer>Korean Edu AI Institute · 한국어교육AI연구개발원</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://xrrgfbidtzsohddiwcbn.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_W7QqGrgNUQ77KgRtdSaANA_F4zrqp8P';
    const supabaseClient = window.supabase
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY)
      : null;

    const signedOutView = document.getElementById('signed-out-view');
    const forbiddenView = document.getElementById('forbidden-view');
    const adminView = document.getElementById('admin-view');
    const listBody = document.getElementById('list-body');
    const listStatus = document.getElementById('list-status');

    const regionLabels = {
      seoul: '서울', busan: '부산', daegu: '대구', incheon: '인천', gwangju: '광주',
      daejeon: '대전', ulsan: '울산', sejong: '세종', gyeonggi: '경기', gangwon: '강원',
      chungbuk: '충북', chungnam: '충남', jeonbuk: '전북', jeonnam: '전남',
      gyeongbuk: '경북', gyeongnam: '경남', jeju: '제주', overseas: '해외', not_set: '미입력'
    };
    const workplaceLabels = {
      center: '다문화·외국인지원센터',
      university_language_institute: '대학교 부설 어학당',
      school: '초·중·고등학교',
      private_academy: '한국어교육기관·학원',
      kiip: '사회통합프로그램 운영기관',
      corporate_public: '기업·공공기관',
      online: '온라인 교육',
      freelance: '프리랜서·개인교습',
      other: '기타',
      not_set: '미입력'
    };
    const documentLabels = {
      teacher_certificate: '교원자격증',
      qualification_confirmation: '교원자격확인서'
    };
    const statusLabels = { pending: '확인 중', verified: '인증 완료', rejected: '거절' };

    let rows = [];
    let filter = 'pending';
    let openId = null;

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function formatDate(value) {
      if (!value) return '-';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '-';
      return `${date.getFullYear()}. ${date.getMonth() + 1}. ${date.getDate()}.`;
    }

    function setListStatus(message, isError) {
      listStatus.textContent = message || '';
      listStatus.classList.toggle('is-error', Boolean(isError));
      listStatus.classList.toggle('is-ok', Boolean(message) && !isError);
    }

    function visibleRows() {
      return filter === 'all' ? rows : rows.filter((row) => row.status === 'pending');
    }

    function renderList() {
      const visible = visibleRows();
      if (!visible.length) {
        listBody.innerHTML = `<tr><td colspan="4" class="empty">${filter === 'pending' ? '확인 중인 신청이 없습니다.' : '제출된 서류가 없습니다.'}</td></tr>`;
        return;
      }

      listBody.innerHTML = visible.map((row) => {
        const isOpen = openId === row.user_id;
        const statusClass = row.status === 'verified' ? 'is-verified' : row.status === 'rejected' ? 'is-rejected' : 'is-pending';
        const canReview = row.status === 'pending';
        return `
          <tr class="${isOpen ? 'is-open' : ''}" data-open-id="${escapeHtml(row.user_id)}">
            <td>
              <strong>${escapeHtml(row.display_name || row.full_name || '-')}</strong>
              <div class="email">${escapeHtml(row.email || '-')}</div>
            </td>
            <td class="col-name">${escapeHtml(documentLabels[row.document_type] || row.document_type || '-')}</td>
            <td><span class="badge ${statusClass}">${escapeHtml(statusLabels[row.status] || row.status)}</span></td>
            <td class="col-date">${escapeHtml(formatDate(row.submitted_at))}</td>
          </tr>
          <tr>
            <td colspan="4" style="padding:0;border:0">
              <div class="detail${isOpen ? ' is-open' : ''}" data-detail-id="${escapeHtml(row.user_id)}">
                <div class="meta">
                  <div>이름: ${escapeHtml(row.full_name || '-')}</div>
                  <div>활동 이름: ${escapeHtml(row.display_name || '-')}</div>
                  <div>지역: ${escapeHtml(regionLabels[row.activity_region] || row.activity_region || '-')}</div>
                  <div>근무 유형: ${escapeHtml(workplaceLabels[row.workplace_type] || row.workplace_type || '-')}</div>
                  <div>파일: ${escapeHtml(row.original_file_name || '-')}</div>
                  ${row.review_note ? `<div>메모: ${escapeHtml(row.review_note)}</div>` : ''}
                </div>
                <div class="actions">
                  <button class="btn ghost" type="button" data-file-path="${escapeHtml(row.file_path || '')}">서류 열기</button>
                  ${canReview ? `
                    <button class="btn primary" type="button" data-approve="true" data-user-id="${escapeHtml(row.user_id)}">승인</button>
                    <button class="btn danger" type="button" data-approve="false" data-user-id="${escapeHtml(row.user_id)}">거절</button>
                  ` : ''}
                </div>
              </div>
            </td>
          </tr>`;
      }).join('');
    }

    async function loadList() {
      setListStatus('');
      const { data, error } = await supabaseClient.rpc('onmaeum_admin_list_verifications');
      if (error) {
        const missing = (error.message || '').includes('onmaeum_admin_list_verifications')
          || error.code === 'PGRST202';
        setListStatus(
          missing
            ? '승인 기능 SQL이 아직 없습니다. onmaeum-admin-teacher-review.sql을 실행해 주세요.'
            : (error.message || '목록을 불러오지 못했습니다.'),
          true
        );
        listBody.innerHTML = '<tr><td colspan="4" class="empty">목록을 불러오지 못했습니다.</td></tr>';
        return;
      }
      rows = data || [];
      if (openId && !rows.some((row) => row.user_id === openId)) openId = null;
      renderList();
    }

    async function openCertificate(filePath) {
      if (!filePath) {
        setListStatus('파일 경로가 없습니다.', true);
        return;
      }
      const { data, error } = await supabaseClient.storage
        .from('teacher-certificates')
        .createSignedUrl(filePath, 120);
      if (error || !data?.signedUrl) {
        setListStatus('서류를 열 수 없습니다. 저장소 권한을 확인해 주세요.', true);
        return;
      }
      window.open(data.signedUrl, '_blank', 'noopener');
    }

    async function reviewTeacher(userId, approve) {
      const action = approve ? '승인' : '거절';
      if (!window.confirm(`이 신청을 ${action}할까요?`)) return;
      setListStatus(`${action}하는 중입니다...`);
      const { error } = await supabaseClient.rpc('onmaeum_admin_review_teacher', {
        p_user_id: userId,
        p_approve: approve,
        p_note: null
      });
      if (error) {
        setListStatus(error.message || `${action}하지 못했습니다.`, true);
        return;
      }
      setListStatus(approve ? '교사 회원으로 승인했습니다.' : '신청을 거절했습니다.');
      await loadList();
    }

    document.querySelectorAll('.chip').forEach((button) => {
      button.addEventListener('click', () => {
        filter = button.dataset.filter;
        document.querySelectorAll('.chip').forEach((chip) => chip.classList.toggle('is-active', chip === button));
        renderList();
      });
    });

    listBody.addEventListener('click', async (event) => {
      const fileButton = event.target.closest('[data-file-path]');
      if (fileButton) {
        event.preventDefault();
        await openCertificate(fileButton.getAttribute('data-file-path'));
        return;
      }
      const reviewButton = event.target.closest('[data-user-id][data-approve]');
      if (reviewButton) {
        event.preventDefault();
        await reviewTeacher(reviewButton.getAttribute('data-user-id'), reviewButton.getAttribute('data-approve') === 'true');
        return;
      }
      const row = event.target.closest('tr[data-open-id]');
      if (!row) return;
      const id = row.getAttribute('data-open-id');
      openId = openId === id ? null : id;
      renderList();
    });

    async function start() {
      if (!supabaseClient) {
        signedOutView.hidden = false;
        signedOutView.querySelector('p').textContent = '회원 시스템을 불러오지 못했습니다.';
        return;
      }
      const { data: sessionData } = await supabaseClient.auth.getSession();
      const user = sessionData?.session?.user;
      if (!user) {
        signedOutView.hidden = false;
        return;
      }

      const { data: profile, error } = await supabaseClient
        .from('profiles')
        .select('is_admin')
        .eq('id', user.id)
        .maybeSingle();

      if (error || profile?.is_admin !== true) {
        forbiddenView.hidden = false;
        return;
      }

      adminView.hidden = false;
      await loadList();
    }

    start();
  </script>
</body>
</html>
